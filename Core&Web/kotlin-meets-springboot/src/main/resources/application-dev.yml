spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

    h2:
      console:
        enabled: true
        path: /h2-console

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:/db/migration/mysql/complete,classpath:/db/migration/mysql/devdata